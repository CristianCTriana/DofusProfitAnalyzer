<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --bg:#0d0d0e; --surface:#1a1a1f; --surface-2:#202127;
      --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
      --text-primary:#f4f3f0; --text-secondary:#c3c2b7; --text-muted:#898781;
      --accent:#eda100; --accent-solid:#c98500; --accent-ink:#16130a;
      --good:#0ca30c; --critical:#d03b3b;
      --sans:'Manrope', system-ui, -apple-system, sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--sans);}
    a{color:var(--accent);} a:hover{color:#ffb733;}
    .screen{
      width:1440px;height:900px;background:var(--bg);position:relative;
      display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .glow{
      position:absolute;top:-220px;left:50%;transform:translateX(-50%);
      width:900px;height:900px;border-radius:50%;
      background:radial-gradient(circle, rgba(237,161,0,0.14) 0%, rgba(237,161,0,0) 70%);
    }
    .card{
      position:relative;width:420px;background:var(--surface);
      border:1px solid var(--border);border-radius:16px;
      padding:40px 36px 32px;
    }
    .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}
    .brand-name{font-size:15px;font-weight:700;color:var(--text-primary);letter-spacing:0.2px;}
    h1{font-size:22px;font-weight:800;color:var(--text-primary);margin:0 0 6px;text-align:center;}
    .sub{font-size:13px;color:var(--text-muted);text-align:center;margin:0 0 28px;}
    .field{margin-bottom:16px;}
    label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
    .input{
      width:100%;padding:12px 14px;border-radius:8px;background:var(--surface-2);
      border:1px solid var(--border-strong);color:var(--text-primary);font-size:14px;font-family:var(--sans);
    }
    .btn-primary{
      width:100%;margin-top:8px;padding:13px 14px;border-radius:8px;border:none;
      background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;
      font-family:var(--sans);cursor:pointer;
    }
    .footer-note{margin-top:22px;font-size:12px;color:var(--text-muted);text-align:center;}
  </style>
</helmet>
<div class="screen">
  <div class="glow"></div>
  <div class="card">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#eda100" stroke-width="1.6"/>
        <path d="M8.5 14c0-1.4 1.3-2.2 3.2-2.2s3-.7 3-1.9-1.3-1.9-3-1.9c-1.5 0-2.7.6-3 1.7" stroke="#eda100" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M11 8.4v7.2" stroke="#eda100" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Dofus Profit Analyzer</span>
    </div>
    <h1>Bienvenido de vuelta</h1>
    <p class="sub">Acceso privado &mdash; solo para el grupo</p>
    <div class="field">
      <label>Correo</label>
      <input class="input" value="cristian@grupo.com" />
    </div>
    <div class="field">
      <label>Contrase&ntilde;a</label>
      <input class="input" value="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
    </div>
    <button class="btn-primary">Iniciar sesi&oacute;n</button>
    <p class="footer-note">&iquest;No tienes acceso? Pídeselo a Cristian.</p>
  </div>
</div>
</x-dc>
</body>
</html>
